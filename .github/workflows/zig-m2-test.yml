name: zig-m2-test
on:
  push:
    branches: [zig-m2-test]
jobs:
  hello:
    runs-on: [self-hosted, zig-m2-test]
    steps:
      - id: build
        run: |
          echo "version=1.2.26789" >> "$GITHUB_OUTPUT"
          echo "go=yes" >> "$GITHUB_OUTPUT"
          echo "GREETING=hello-from-env" >> "$GITHUB_ENV"
          mkdir -p /opt/t/bin && printf "#!/bin/sh\necho tool-ran\n" > /opt/t/bin/tool && chmod +x /opt/t/bin/tool
          echo "/opt/t/bin" >> "$GITHUB_PATH"
      - name: Use outputs
        run: echo "version=${{ steps.build.outputs.version }} greeting=$GREETING" && tool && echo "ci=$CI sha=$GITHUB_SHA ref=$GITHUB_REF_NAME"
      - name: Gated by an output
        if: steps.build.outputs.go == 'yes'
        run: echo gate-open
      - name: Not gated in
        if: steps.build.outputs.go == 'no'
        run: echo should-not-run
