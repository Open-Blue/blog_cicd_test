name: zig-m2-test
on:
  push:
    branches: [zig-m2-test]
jobs:
  hello:
    runs-on: [self-hosted, zig-m2-test]
    steps:
      - uses: actions/checkout@v4
      - name: Look at the workspace
        run: ls -a | head -8 && head -3 README.md
      - name: Second checkout
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-copy
      - run: ls main-copy | head -3
