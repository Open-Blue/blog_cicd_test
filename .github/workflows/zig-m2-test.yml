name: zig-m2-test
on:
  push:
    branches: [zig-m2-test]
env:
  WORKFLOW_ENV: from-workflow
jobs:
  hello:
    runs-on: [self-hosted, zig-m2-test]
    env:
      JOB_ENV: ${{ github.ref_name }}-job
    steps:
      - id: first
        name: Build ${{ github.ref_name }}
        env:
          STEP_ENV: ${{ github.sha }}
        run: echo "sha=${{ github.sha }} env=$STEP_ENV job=${{ env.JOB_ENV }}"
      - if: github.ref == 'refs/heads/zig-m2-test'
        run: echo only-on-this-branch
      - if: ${{ failure() }}
        run: echo only-on-failure
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: echo "outcome=${{ steps.first.outcome }} fmt=${{ format('{0}-{1}', 1, 2) }}"
